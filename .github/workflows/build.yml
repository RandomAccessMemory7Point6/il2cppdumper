name: Build Il2CppDumper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build with ndk-build
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=./jni/Application.mk \
            APP_ABI=arm64-v8a \
            -j4

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: libil2cppdumper-arm64
          path: libs/arm64-v8a/libil2cppdumper.so
